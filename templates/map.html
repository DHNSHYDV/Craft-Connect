{% extends "base.html" %}

{% block content %}
<section class="map-page-section">
    <div class="map-header">
        <h2 class="hero-title-premium">Search by Location</h2>
        <p class="hero-subtitle-premium">Hover over the states to discover the rich artistic legacy of Desh Ke Haath.
        </p>
    </div>

    <div class="map-page-container">
        <!-- SVG Connector Line Overlay -->
        <svg id="map-connector-svg" class="map-connector-overlay">
            <line id="map-connector-line" x1="0" y1="0" x2="0" y2="0" stroke="var(--accent-color)" stroke-width="1.5"
                stroke-dasharray="5,5" opacity="0" />
            <circle id="map-connector-dot" cx="0" cy="0" r="3" fill="var(--accent-color)" opacity="0" />
        </svg>

        <div id="india-map-wrapper">
            {% include 'includes/india_map.svg' %}
        </div>

        <div id="map-tooltip" class="map-tooltip">
            <h4 class="tooltip-state">State Name</h4>
            <ul class="tooltip-items">
                <li>Popular Craft 1</li>
                <li>Popular Craft 2</li>
            </ul>
        </div>
    </div>

    <div class="map-legend">
        <div class="legend-item">
            <span class="legend-color"></span>
            <p>Hover over states to explore handicrafts</p>
        </div>
    </div>
</section>


<script>
    document.body.classList.add('map-page-body');
</script>

<style>
    /*
     * MAP VISUAL UPDATES
     * Increased size and theme-adaptive background
     */

    html,
    body.map-page-body {
        height: 100%;
        margin: 0;
        overflow-x: hidden;
    }

    /* Use Theme Background - Remove Grid */
    body.map-page-body {
        background-color: var(--bg-color) !important;
        background-image: none !important;
        transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Ensure content containers are transparent so body bg shows */
    /* Ensure content containers are transparent so body bg shows */
    body.map-page-body main,
    body.map-page-body .map-page-section {
        background: transparent !important;
    }

    /* Existing Map Styles - Critical for layout */
    .map-page-section {
        padding: 120px 20px 60px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        position: relative;
        background: transparent !important;
        transition: background 0.3s ease;
        z-index: 5;
    }

    main {
        background: transparent !important;
    }

    .map-header {
        text-align: center;
        margin-bottom: 4rem;
        max-width: 800px;
        position: relative;
        z-index: 10;
    }

    .map-page-container {
        position: relative;
        width: 100%;
        max-width: 1200px;
        /* Increased from 900px */
        margin: 0 auto;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1.5rem;
        gap: 1.5rem;
        /* filter: drop-shadow(0 30px 60px rgba(0, 0, 0, 0.15)); */
        z-index: 10;
        z-index: 10;
    }

    .map-connector-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1500;
        overflow: visible;
    }

    #map-connector-line {
        transition: opacity 0.3s;
    }

    body.dark-mode #india-map-wrapper {
        background: transparent !important;
    }

    body:not(.dark-mode) #india-map-wrapper {
        background: transparent !important;
    }

    #india-map-wrapper {
        flex: 0 1 70%;
        /* Increased flex basis */
        display: flex;
        justify-content: center;
        padding: 1rem;
        /* Reduced padding */
        border-radius: 20px;
        background: transparent !important;
    }

    /* Force all parents to be transparent */
    /* Force all parents to be transparent */
    .map-page-section,
    .map-page-container,
    .map-page-container *,
    #india-map-wrapper,
    main {
        background-color: transparent !important;
    }

    /* Nuclear option for map section children */
    .map-page-section * {
        background-color: transparent !important;
    }

    /* Re-apply background to tooltips and specific UI elements if needed */
    .map-tooltip {
        background: var(--card-bg) !important;
    }

    /* Ensure content containers are transparent so body bg shows */
    html {
        background: transparent !important;
    }

    /* Ensure Body and HTML carry the color */
    html,
    body.map-page-body {
        background-color: var(--bg-color) !important;
    }

    #india-map-wrapper svg {
        width: 100%;
        height: auto;
        max-height: 85vh;
        /* Increased from 70vh */
        transition: transform 0.3s ease, filter 0.3s ease;
    }
</style>


{% endblock %}
