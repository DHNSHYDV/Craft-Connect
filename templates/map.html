{% extends "base.html" %}

{% block content %}
<section class="map-page-section">
    <div class="map-header">
        <h2 class="section-title">Heritage Map of India</h2>
        <p class="section-subtitle">Hover over the states to discover the rich artistic legacy of Desh Ke Haath.</p>
    </div>

    <div class="map-page-container">
        <!-- SVG Connector Line Overlay -->
        <svg id="map-connector-svg" class="map-connector-overlay">
            <line id="map-connector-line" x1="0" y1="0" x2="0" y2="0" stroke="var(--accent-color)" stroke-width="1.5"
                stroke-dasharray="5,5" opacity="0" />
            <circle id="map-connector-dot" cx="0" cy="0" r="3" fill="var(--accent-color)" opacity="0" />
        </svg>

        <div id="india-map-wrapper">
            {% include 'includes/india_map.svg' %}
        </div>

        <div id="map-tooltip" class="map-tooltip">
            <h4 class="tooltip-state">State Name</h4>
            <ul class="tooltip-items">
                <li>Popular Craft 1</li>
                <li>Popular Craft 2</li>
            </ul>
        </div>
    </div>

    <div class="map-legend">
        <div class="legend-item">
            <span class="legend-color"></span>
            <p>Hover over states to explore handicrafts</p>
        </div>
    </div>
</section>


<script>
    document.body.classList.add('map-page-body');
    // Force transparency on direct parents just in case
    document.documentElement.style.background = 'transparent';
</script>

<style>
    /*
     * FORCE GRID VISIBILITY
     * Injected directly to bypass cache issues
     */

    /* Ensure HTML/Body stack is transparent so our background shows */
    html,
    body.map-page-body {
        height: 100%;
        margin: 0;
        overflow-x: hidden;
    }

    /* Apply Grid to Body */
    body.map-page-body {
        /* Grid Variables */
        --gap-size: 25px;
        --line-thickness: 1px;

        /* Light Mode Colors - High Contrast */
        --grid-bg: #f8f9fa;
        --grid-line: #ccc;

        background-color: var(--grid-bg) !important;
        background-image:
            repeating-linear-gradient(var(--grid-line) 0 var(--line-thickness), transparent var(--line-thickness) var(--gap-size)),
            repeating-linear-gradient(90deg, var(--grid-line) 0 var(--line-thickness), transparent var(--line-thickness) var(--gap-size)) !important;
        background-size: 100% var(--gap-size), var(--gap-size) 100% !important;
        animation: scroll 3s linear infinite;
    }

    /* Dark Mode Colors - High Contrast */
    body.dark-mode.map-page-body {
        --grid-bg: #000000;
        --grid-line: #333333;
    }

    /* Animation */
    @keyframes scroll {
        0% {
            background-position: 0 0, 0 0;
        }

        100% {
            background-position: 0 var(--gap-size), var(--gap-size) 0;
        }
    }

    /* Aggressive Transparency Overrides */
    body.map-page-body main,
    body.map-page-body .map-page-section,
    html {
        background: transparent !important;
        background-color: transparent !important;
    }

    /* Existing Map Styles - Critical for layout */
    .map-page-section {
        padding: 120px 20px 60px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        position: relative;
        background: transparent !important;
        transition: background 0.3s ease;
        z-index: 5;
        /* Ensure content is above stars */
    }

    main {
        background: transparent !important;
    }

    .map-header {
        text-align: center;
        margin-bottom: 4rem;
        max-width: 800px;
        position: relative;
        z-index: 10;
    }

    .section-title {
        font-size: 3rem;
        margin-bottom: 1rem;
        color: var(--accent-color);
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .section-subtitle {
        font-size: 1.1rem;
        opacity: 0.9;
        letter-spacing: 1px;
        color: var(--text-color);
    }

    .map-page-container {
        position: relative;
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1.5rem;
        filter: drop-shadow(0 30px 60px rgba(0, 0, 0, 0.15));
        z-index: 10;
    }

    .map-connector-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1500;
        overflow: visible;
    }

    #map-connector-line {
        transition: opacity 0.3s;
    }

    body.dark-mode #india-map-wrapper {
        background: transparent;
    }

    body:not(.dark-mode) #india-map-wrapper {
        background: transparent;
    }

    #india-map-wrapper {
        flex: 0 1 55%;
        display: flex;
        justify-content: center;
        /* Background handled by theme selector above */
        padding: 2rem;
        border-radius: 20px;
    }

    #india-map-wrapper svg {
        width: 100%;
        height: auto;
        max-height: 70vh;
        /* filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.1)); */
        transition: transform 0.3s ease, filter 0.3s ease;
    }
</style>


{% endblock %}
